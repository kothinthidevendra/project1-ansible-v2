  - name: enabling mysql:8.4 module
    command: dnf module enable mysql:8.4 -y

  - name: installation of mysql
    package:
      name: mysql-server
      state: present

  - name: start and enable the service
    service: 
      name: mysqld
      state: started
      enabled: yes

  - name: setting mysql root password
    command: mysql_secure_installation --set-root-pass "{{ vault_mysql_root_password }}"
