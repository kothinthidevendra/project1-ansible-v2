  - name: copying the mongodb repo
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
  
  - name: installation of mongodb
    package:
      name: mongodb-org
      state: present

  - name: start and enable the mongod service
    service:
      name: mongod
      state: started
      enabled: yes

  - name: allowing remote connectivity in mongodb config file
    replace:
      path: /etc/mongod.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'

  - name: restrating the mongodb service
    service:
      name: mongod
      state: restarted